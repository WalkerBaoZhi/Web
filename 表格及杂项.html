<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格及杂项</title>
</head>
<body>
    <table>
        <caption>学生信息表</caption>
        <thead>
            <tr>
                <th>姓名</th>
                <th>年龄</th>
                <th>性别</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td>20</td>
                <td>男</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>22</td>
                <td>女</td>
            </tr>
            <tr>
                <td>王五</td>
                <td>21</td>
                <td>男</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
