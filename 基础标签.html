<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础标签</title>
</head>

<body>
    <h1>基础标签</h1>
    <br>

    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <h4>四级标题</h4>
    <h5>五级标题</h5>
    <h6>六级标题</h6>

    <p>这是一个段落。</p>

    <a href="https://www.example.com">这是一个链接</a>

    <ul>
        <li>列表项 1</li>
        <li>列表项 2</li>
        <li>列表项 3</li>
    </ul>

    <div>
        <h2>这是一个标题</h2>
        <p>这是一个包含在 div 中的段落。</p>
        <!-- div包含一块代码 -->
    </div>

    <span>
        <h2>这是一个 span 中的标题</h2>
    </span>

    <pre>
        pre标签中的文本在编辑器什么样在网页就什么样
        比如说  空格
        换行
         以及其他的格式都会被保留
    </pre>

    <hr>
    <h1>hr标签就是分界线</h1>

    <pre>
    <i>斜体文本</i>

    <b>粗体文本</b>
    
    <del>删除线文本</del>

    <ins>下划线文本</ins>
    </pre>

    <img src="https://example.com/image.jpg" alt="示例图片" width="300" height="200">
    <!-- 图片标签，src属性指定图片的URL，alt属性提供图片无法显示时的替代文本 -->
    <!-- width和height属性指定图片的宽度和高度 -->
    <hr>
    <a href="https://developer.mozilla.org/zh-CN/docs/Web/HTML/Guides/Cheatsheet"><strong><h1>懒逼去看吧，所有的标签</h1></strong></a>
</body>

</html>
